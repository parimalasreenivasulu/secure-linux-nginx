# /etc/nginx/nginx.conf
# Reverse proxy for a backend app on 127.0.0.1:3000 with TLS, gzip,
# cache headers, proxy caching and rate limiting.
# Replace app.example.com with your domain.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    ##
    # Basics
    ##
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                      # hide nginx version
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          15s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    ##
    # Gzip compression
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml image/svg+xml font/ttf font/otf;

    ##
    # Rate limiting
    #   general: 10 req/s per IP, api: 5 req/s per IP, 20 concurrent conns
    ##
    limit_req_zone  $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    ##
    # Proxy cache
    ##
    proxy_cache_path /var/cache/nginx/app levels=1:2 keys_zone=app_cache:10m
                     max_size=500m inactive=60m use_temp_path=off;

    ##
    # TLS (shared settings)
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ##
    # Upstream application
    ##
    upstream app_backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    ##
    # HTTP :80 -> ACME challenge + redirect to HTTPS
    ##
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name app.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    ##
    # HTTPS :443 -> reverse proxy
    ##
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.example.com;

        # Certificate paths (Let's Encrypt or self-signed, see snippets/)
        include /etc/nginx/snippets/ssl-certs.conf;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        limit_conn perip 20;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Static assets: cached at nginx and in the browser
        location /static/ {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://app_backend;
            proxy_cache app_cache;
            proxy_cache_valid 200 301 302 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_ignore_headers Set-Cookie;
            # add_header in a location discards server-level add_header, so repeat security headers
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # API: stricter limit, never cached
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://app_backend;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Everything else
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://app_backend;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "no-cache" always;
        }

        # Block dotfiles (except ACME)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
